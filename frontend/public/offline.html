<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00F0FF" />
    <title>Offline — Rip N' Flip</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Chivo:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050505;
        color: #fff;
        font-family: 'Chivo', system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 20% 20%, rgba(0,240,255,0.08), transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(255,0,153,0.08), transparent 50%),
          #050505;
      }
      .wrap {
        text-align: center;
        max-width: 480px;
        width: 100%;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
        filter: drop-shadow(0 0 30px rgba(57,255,20,0.45));
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      h1 {
        font-family: 'Teko', sans-serif;
        font-size: 56px;
        line-height: 1;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
        text-transform: uppercase;
        font-weight: 700;
      }
      h1 .pink { color: #FF0099; }
      h1 .cyan { color: #00F0FF; }
      .tag {
        font-family: 'JetBrains Mono', monospace;
        color: #FF0099;
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-bottom: 28px;
      }
      p {
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.6;
        margin: 0 0 28px;
      }
      .btn {
        display: inline-block;
        padding: 14px 32px;
        background: #00F0FF;
        color: #050505;
        text-decoration: none;
        font-family: 'Teko', sans-serif;
        font-size: 22px;
        letter-spacing: 0.18em;
        font-weight: 700;
        text-transform: uppercase;
        transform: skewX(-5deg);
        transition: transform 0.18s ease;
        cursor: pointer;
        border: 0;
      }
      .btn:hover { transform: skewX(-5deg) translateY(-2px); }
      .btn span { display: inline-block; transform: skewX(5deg); }
      .hint {
        margin-top: 24px;
        font-size: 12px;
        color: rgba(255,255,255,0.35);
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">
        <img src="/logo.png" alt="Rip N' Flip" />
      </div>
      <div class="tag">// CONNECTION DROPPED</div>
      <h1>RIP <span class="cyan">N'</span> <span class="pink">FLIP</span></h1>
      <p>You're offline. Pack rips need fresh eBay comps — reconnect to get back to the hunt.</p>
      <button class="btn" onclick="location.reload()" data-testid="offline-retry-btn"><span>RETRY</span></button>
      <div class="hint">Last cached pages still load when offline.</div>
    </div>
    <script>
      // Auto-reload when network comes back
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
